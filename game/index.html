<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Surge: Cyber Survivor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #05060b;
      color: #e0f2fe;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #container {
      position: relative;
      width: 960px;
      height: 640px;
      box-shadow: 0 0 50px rgba(6, 182, 212, 0.25), 0 0 100px rgba(168, 85, 247, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.4);
      border-radius: 8px;
      background: #090a12;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: auto;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="gameCanvas" width="960" height="640"></canvas>
    <div id="ui-overlay"></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
